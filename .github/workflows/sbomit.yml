
name: SBOMit Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Build under SBOMit
        uses: Uk-jake/sbomit-pipeline-runner@main
        with:
          build-command: |
            uv build --wheel
          sbom-format: spdx23
          use-syft: true
